<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio-aware Event Triage High-fidelity Frames</title>
    <link rel="stylesheet" href="../../design-system/tokens/valley-reference-tokens.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--nf-surface-dashboard-desktop);
        color: var(--nf-text-body);
        font-family: var(--nf-font-sans);
      }

      button {
        font: inherit;
      }

      .review-shell {
        min-height: 100vh;
        display: grid;
        place-items: start center;
        padding: 24px;
      }

      .demo-layout {
        width: min(100%, 820px);
        display: grid;
        grid-template-columns: minmax(0, var(--frame-width, 390px)) minmax(260px, 1fr);
        gap: var(--nf-space-5);
        align-items: start;
      }

      .phone {
        width: min(100vw, var(--frame-width, 390px));
        min-height: var(--frame-height, 844px);
        background: var(--nf-surface-dashboard-mobile);
        border: 1px solid var(--nf-border-default);
        box-shadow: var(--nf-shadow-card);
        overflow: hidden;
      }

      .screen {
        position: relative;
        min-height: var(--frame-height, 844px);
        padding: 0 var(--nf-mobile-page-padding) 104px;
      }

      .topbar {
        height: var(--nf-gnb-height-reference);
        display: grid;
        grid-template-columns: 44px 1fr 44px;
        align-items: center;
        gap: var(--nf-space-2);
      }

      .icon-button {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: var(--nf-radius-lg);
        background: transparent;
        color: var(--nf-text-strong);
        display: grid;
        place-items: center;
        cursor: pointer;
      }

      .icon-button:focus-visible,
      .primary-cta:focus-visible,
      .secondary-action:focus-visible,
      .state-chip:focus-visible {
        outline: 2px solid var(--nf-border-focus);
        outline-offset: 2px;
      }

      .top-title {
        margin: 0;
        color: var(--nf-text-title);
        font-size: var(--nf-text-sm);
        line-height: var(--nf-leading-sm);
        font-weight: var(--nf-weight-semibold);
        text-align: center;
      }

      .disclosure {
        display: flex;
        gap: var(--nf-space-2);
        align-items: flex-start;
        margin-bottom: var(--nf-space-3);
        padding: 9px 10px;
        border: 1px solid var(--nf-border-default);
        border-radius: var(--nf-radius-lg);
        background: var(--nf-surface-card-muted);
        color: var(--nf-text-muted);
        font-size: var(--nf-text-xs);
        line-height: var(--nf-leading-xs);
      }

      .stack {
        display: grid;
        gap: var(--nf-space-3);
      }

      .card {
        border: 1px solid var(--nf-border-default);
        border-radius: var(--nf-radius-lg);
        background: var(--nf-surface-card);
        padding: var(--nf-mobile-card-padding);
        box-shadow: var(--nf-shadow-card);
      }

      .muted-card {
        background: var(--nf-surface-card-muted);
      }

      .section-kicker {
        margin: 0 0 var(--nf-space-2);
        color: var(--nf-text-muted);
        font-size: var(--nf-text-xs);
        line-height: var(--nf-leading-xs);
        font-weight: var(--nf-weight-medium);
      }

      .event-title {
        margin: var(--nf-space-2) 0;
        color: var(--nf-text-title);
        font-size: var(--nf-text-lg);
        line-height: var(--nf-leading-lg);
        font-weight: var(--nf-weight-semibold);
        letter-spacing: 0;
        overflow-wrap: anywhere;
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--nf-space-1) var(--nf-space-2);
        color: var(--nf-text-muted);
        font-size: var(--nf-text-xs);
        line-height: var(--nf-leading-xs);
        font-weight: var(--nf-weight-normal);
      }

      .badge-row {
        display: flex;
        flex-wrap: wrap;
        gap: var(--nf-space-2);
        align-items: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 3px 8px;
        border: 1px solid var(--nf-border-default);
        border-radius: var(--nf-radius-sm);
        background: var(--nf-surface-card-muted);
        color: var(--nf-text-body);
        font-size: var(--nf-text-xs);
        line-height: var(--nf-leading-xs);
        font-weight: var(--nf-weight-medium);
      }

      .badge.event {
        background: var(--nf-semantic-info-50);
        border-color: var(--nf-semantic-info-100);
        color: var(--nf-text-info);
      }

      .badge.relationship {
        background: var(--nf-semantic-secondary-50);
        border-color: var(--nf-semantic-secondary-100);
        color: var(--nf-semantic-secondary-500);
      }

      .badge.watchlist {
        background: var(--nf-semantic-tertiary-50);
        border-color: var(--nf-semantic-tertiary-100);
        color: var(--nf-sky-600);
      }

      .badge.warning {
        background: var(--nf-semantic-warning-50);
        border-color: var(--nf-semantic-warning-100);
        color: var(--nf-text-warning);
      }

      .badge.error {
        background: var(--nf-semantic-error-50);
        border-color: var(--nf-semantic-error-100);
        color: var(--nf-text-error);
      }

      .asset-line {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: var(--nf-space-3);
        align-items: start;
      }

      .asset-name {
        margin: 0;
        color: var(--nf-text-title);
        font-size: var(--nf-text-base);
        line-height: var(--nf-leading-base);
        font-weight: var(--nf-weight-semibold);
        overflow-wrap: anywhere;
      }

      .ticker {
        color: var(--nf-text-muted);
        font-family: var(--nf-font-mono);
        font-size: var(--nf-text-xs);
        line-height: var(--nf-leading-xs);
        white-space: nowrap;
      }

      .body-copy {
        margin: var(--nf-space-2) 0 0;
        color: var(--nf-text-body);
        font-size: var(--nf-text-sm);
        line-height: var(--nf-leading-sm);
        font-weight: var(--nf-weight-normal);
        overflow-wrap: anywhere;
      }

      .context-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--nf-space-2);
      }

      .context-item {
        display: grid;
        gap: 3px;
        padding-top: var(--nf-space-2);
        border-top: 1px solid var(--nf-border-subtle);
      }

      .context-item:first-child {
        padding-top: 0;
        border-top: 0;
      }

      .label {
        color: var(--nf-text-muted);
        font-size: var(--nf-text-2xs);
        line-height: var(--nf-leading-2xs);
        font-weight: var(--nf-weight-normal);
      }

      .value {
        color: var(--nf-text-strong);
        font-size: var(--nf-text-sm);
        line-height: var(--nf-leading-sm);
        font-weight: var(--nf-weight-medium);
      }

      .evidence-summary {
        display: grid;
        gap: var(--nf-space-2);
      }

      .source-block {
        padding-top: var(--nf-space-2);
        border-top: 1px solid var(--nf-border-subtle);
      }

      .source-block .meta-row {
        margin-top: 2px;
      }

      .outcome {
        border-left: 3px solid var(--nf-outcome-check-border);
        background: var(--nf-outcome-check-bg);
      }

      .outcome.no-check {
        border-left-color: var(--nf-outcome-no-check-border);
        background: var(--nf-outcome-no-check-bg);
      }

      .outcome.insufficient {
        border-left-color: var(--nf-outcome-insufficient-border);
        background: var(--nf-outcome-insufficient-bg);
      }

      .outcome-title {
        margin: 0;
        color: var(--nf-text-title);
        font-size: var(--nf-text-xl);
        line-height: var(--nf-leading-xl);
        font-weight: var(--nf-weight-bold);
      }

      .reason-list {
        margin: var(--nf-space-2) 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: var(--nf-space-1);
      }

      .reason-list li {
        color: var(--nf-text-body);
        font-size: var(--nf-text-sm);
        line-height: var(--nf-leading-sm);
        font-weight: var(--nf-weight-normal);
      }

      .reason-list li::before {
        content: "•";
        margin-right: 6px;
        color: var(--nf-text-muted);
      }

      .sticky-area {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: var(--nf-space-3) var(--nf-mobile-page-padding) calc(var(--nf-space-3) + env(safe-area-inset-bottom));
        background: linear-gradient(180deg, #f4f4f500, var(--nf-surface-dashboard-mobile) 24%);
      }

      .handoff-card {
        border: 1px solid var(--nf-border-default);
        border-radius: var(--nf-radius-lg);
        background: var(--nf-surface-card);
        padding: var(--nf-space-3);
        box-shadow: var(--nf-shadow-card);
      }

      .primary-cta {
        width: 100%;
        min-height: var(--nf-min-touch-target);
        border: 1px solid var(--nf-semantic-primary-600);
        border-radius: var(--nf-radius-lg);
        background: var(--nf-semantic-primary-600);
        color: var(--nf-white);
        font-size: var(--nf-text-sm);
        line-height: var(--nf-leading-sm);
        font-weight: var(--nf-weight-semibold);
        cursor: pointer;
      }

      .primary-cta:disabled {
        border-color: var(--nf-border-default);
        background: var(--nf-semantic-basic-200);
        color: var(--nf-text-muted);
        cursor: not-allowed;
      }

      .secondary-action {
        min-height: 36px;
        border: 1px solid var(--nf-border-default);
        border-radius: var(--nf-radius-md);
        background: var(--nf-surface-card);
        color: var(--nf-text-body);
        padding: 0 var(--nf-space-3);
        font-size: var(--nf-text-xs);
        line-height: var(--nf-leading-xs);
        font-weight: var(--nf-weight-medium);
      }

      .demo-panel {
        position: sticky;
        top: 24px;
        border: 1px solid var(--nf-border-default);
        border-radius: var(--nf-radius-lg);
        background: var(--nf-surface-card);
        padding: var(--nf-space-4);
        box-shadow: var(--nf-shadow-card);
      }

      .demo-panel-title {
        margin: 0 0 var(--nf-space-2);
        color: var(--nf-text-title);
        font-size: var(--nf-text-base);
        line-height: var(--nf-leading-base);
        font-weight: var(--nf-weight-semibold);
      }

      .demo-panel-copy {
        margin: 0 0 var(--nf-space-4);
        color: var(--nf-text-muted);
        font-size: var(--nf-text-xs);
        line-height: var(--nf-leading-sm);
        font-weight: var(--nf-weight-normal);
      }

      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: var(--nf-space-2);
        padding: 0 0 var(--nf-space-3);
        margin-bottom: var(--nf-space-3);
      }

      .state-chip {
        flex: 0 0 auto;
        min-height: 36px;
        border: 1px solid var(--nf-border-default);
        border-radius: var(--nf-radius-lg);
        background: var(--nf-surface-card);
        color: var(--nf-text-body);
        padding: 0 var(--nf-space-3);
        font-size: var(--nf-text-xs);
        line-height: var(--nf-leading-xs);
        font-weight: var(--nf-weight-medium);
        cursor: pointer;
      }

      .state-chip[aria-pressed="true"] {
        border-color: var(--nf-semantic-primary-500);
        color: var(--nf-text-primary);
      }

      .frame-note {
        margin: 0 0 var(--nf-space-3);
        color: var(--nf-text-muted);
        font-size: var(--nf-text-xs);
        line-height: var(--nf-leading-xs);
        font-weight: var(--nf-weight-normal);
      }

      body.capture .demo-panel {
        display: none;
      }

      body.capture .demo-layout {
        width: min(100vw, var(--frame-width, 390px));
        display: block;
      }

      body.capture .disclosure {
        margin-top: 0;
      }

      .skeleton {
        height: 14px;
        border-radius: var(--nf-radius-sm);
        background: var(--nf-surface-skeleton);
      }

      .skeleton.wide {
        width: 100%;
      }

      .skeleton.mid {
        width: 72%;
      }

      .skeleton.short {
        width: 42%;
      }

      @media (max-width: 430px) {
        .review-shell {
          padding: 0;
        }

        .demo-layout {
          width: 100vw;
          display: block;
        }

        .phone {
          width: 100vw;
          min-height: 100vh;
          border: 0;
        }

        .screen {
          min-height: 100vh;
        }

        .event-title {
          font-size: var(--nf-text-base);
          line-height: var(--nf-leading-base);
        }

        .demo-panel {
          position: static;
          border-radius: 0;
          border-left: 0;
          border-right: 0;
          border-bottom: 0;
        }
      }
    </style>
  </head>
